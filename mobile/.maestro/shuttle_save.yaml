appId: com.maslul.app
name: A complete shuttle is saved, edited and deleted
---
- launchApp
- runFlow: subflows/_new_shuttle.yaml
- tapOn:
    id: shuttle_name
- inputText: Maestro shuttle
- hideKeyboard
- tapOn: From
- tapOn:
    id: field_to
- inputText: dizengoff center
- extendedWaitUntil:
    visible:
      text: "Dizengoff Center.*"
      childOf:
        id: search_results
    timeout: 20000
# Scoped to the results: the typed text in the field matches too (Maestro ignores case).
- tapOn:
    text: "Dizengoff Center.*"
    childOf:
      id: search_results
- tapOn: To
- tapOn:
    id: field_to
- inputText: azrieli center
- extendedWaitUntil:
    visible:
      text: "Azrieli Center.*"
      childOf:
        id: search_results
    timeout: 20000
# Scoped to the results: the typed text in the field matches too (Maestro ignores case).
- tapOn:
    text: "Azrieli Center.*"
    childOf:
      id: search_results
- tapOn:
    id: shuttle_times
- inputText: "8:15 07:30"
- hideKeyboard
# Drag the ride-time slider right: it lands near the end (100–120 min; the swipe stops short of the edge).
- swipe:
    from:
      id: shuttle_ride_slider
    direction: RIGHT
- assertVisible:
    id: shuttle_ride
    text: "1[0-2][05] min"
- assertNotVisible:
    id: shuttle_missing
- scrollUntilVisible:
    element:
      id: shuttle_save
- tapOn:
    id: shuttle_save
- extendedWaitUntil:
    visible: Maestro shuttle
    timeout: 5000
- assertVisible: "07:30, 08:15 · Sun–Thu"
- tapOn: Maestro shuttle
- assertVisible: Edit shuttle
- assertVisible:
    id: shuttle_ride
    text: "1[0-2][05] min"
- scrollUntilVisible:
    element: Delete
- tapOn:
    id: shuttle_delete
- tapOn:
    id: shuttle_delete_confirm
- assertNotVisible: Maestro shuttle
