# Shared: plan from here to Dizengoff Center and wait for the routes.
appId: com.maslul.app
---
- tapOn: "Where to?"
- tapOn:
    id: field_to
- inputText: dizengoff center
- extendedWaitUntil:
    visible:
      text: "Dizengoff Center.*"
      childOf:
        id: search_results
    timeout: 20000
# Scoped to the results: the typed text in the field matches too (Maestro ignores case).
- tapOn:
    text: "Dizengoff Center.*"
    childOf:
      id: search_results
- extendedWaitUntil:
    visible:
      id: routes_list
    timeout: 40000
