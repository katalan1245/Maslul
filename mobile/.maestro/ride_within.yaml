appId: com.maslul.app
name: A ride within minutes says where to get out
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/_settings_advanced.yaml
    env:
      RIDES: "on"
      ON_BOARD: "off"
- tapOn: "Where to?"
- tapOn:
    id: field_to
- inputText: haifa center
- extendedWaitUntil:
    visible:
      text: "Haifa Center HaShemona.*"
      childOf:
        id: search_results
    timeout: 20000
# Scoped to the results: the typed text in the field matches too (Maestro ignores case).
- tapOn:
    text: "Haifa Center HaShemona.*"
    childOf:
      id: search_results
- extendedWaitUntil:
    visible:
      id: ride_chip
    timeout: 40000
- tapOn:
    id: ride_chip
- tapOn: 15 min
- tapOn:
    id: ride_within
- extendedWaitUntil:
    visible: ".*Get dropped off.*"
    timeout: 60000
- assertVisible: 15 min ride
