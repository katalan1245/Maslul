appId: com.maslul.app
name: Advanced tools stay out of the way until switched on
---
# Both switches off: no "On a bus?" and no ride chip.
- launchApp:
    clearState: true
- runFlow:
    file: subflows/_settings_advanced.yaml
    env:
      RIDES: "off"
      ON_BOARD: "off"
- assertNotVisible:
    id: on_board
- runFlow: subflows/_plan_to_dizengoff.yaml
- assertNotVisible:
    id: ride_chip
- back
- runFlow:
    file: subflows/_settings_advanced.yaml
    env:
      RIDES: "on"
      ON_BOARD: "off"
- runFlow: subflows/_plan_to_dizengoff.yaml
- tapOn:
    id: ride_chip
- assertVisible: "Getting a ride (טרמפ)?"
