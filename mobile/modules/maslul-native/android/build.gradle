plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.maslul.nativehelpers'
version = '1.0.0'

android {
  namespace "com.maslul.nativehelpers"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The same decoder the Kotlin app used for the SIRI snapshots.
  implementation "org.brotli:dec:0.1.2"
}
